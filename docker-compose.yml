name: sms-gateway

x-app-env: &app-env
  MYSQL_DSN: sms:sms@tcp(mysql:3306)/sms?parseTime=true&loc=UTC
  REDIS_ADDR: redis:6379
  METRICS_ADDR: ":9100"
  SENTRY_DSN: ${SENTRY_DSN:-}
  ENVIRONMENT: ${ENVIRONMENT:-development}

x-app-deps: &app-deps
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  mysql:
    image: mysql:9.7.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sms
      MYSQL_PASSWORD: sms
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usms", "-psms"]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    image: mysql:9.7.4
    entrypoint: ["sh", "/deploy/migrate.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
      APP_USER: sms
      DATABASES: sms sms_test
    volumes:
      - ./migrations:/migrations:ro
      - ./deploy/mysql/migrate.sh:/deploy/migrate.sh:ro
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  receiver:
    build:
      context: .
      args:
        APP: receiver
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on: *app-deps
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        APP: worker
    environment:
      <<: *app-env
    depends_on: *app-deps
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - receiver
      - worker

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sms-gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
