global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: receiver
    dns_sd_configs:
      - names: [receiver]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s
